services:
  nginx:
    build: ./nginx
    container_name: nginx
    restart: no
    ports:
      - "80:80"
    depends_on:
      - client
      - api_java_teacherservice
      - api_golang_studentservice
      - api_python_employeeservice
  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: myUser
      MONGO_INITDB_ROOT_PASSWORD: myPassword
      MONGO_INITDB_DATABASE: kindergarten
    volumes:
      - mongo-data:/data/db

  client:
    build: ./frontend
    ports:
      - "3000:3000"

  api_python_employeeservice:
    build: ./employeeservice
    ports:
      - "5003:5003"
    environment:
      MONGODB_URI: mongodb://myUser:myPassword@mongo:27017/kindergarten?authSource=admin
      DATABASE_NAME: kindergarten
    depends_on:
      - mongo

  api_golang_studentservice:
    build: ./studentservice
    ports:
      - "5001:5001"
    environment:
      MONGODB_URI: mongodb://myUser:myPassword@mongo:27017/kindergarten?authSource=admin
      DATABASE_NAME: kindergarten
    depends_on:
      - mongo

  api_java_teacherservice:
    build: ./teacherservice
    ports:
      - "5002:5002"
    environment:
      MONGODB_URI: mongodb://myUser:myPassword@mongo:27017/kindergarten?authSource=admin
      DATABASE_NAME: kindergarten
    depends_on:
      - mongo

volumes:
  mongo-data:
